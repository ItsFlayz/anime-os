name: Anime OS Cloud ISO Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

    - name: Build Full RootFS
      run: |
        sudo bash scripts/rootfs_builder.sh
        sudo bash scripts/desktop_setup.sh
        sudo bash scripts/security_toolkit.sh

    - name: Create ISO Image
      run: |
        sudo bash scripts/iso_builder.sh

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnimeOS-v1.0-x86_64-Full
        path: build/AnimeOS-v1.0-x86_64.iso
        if-no-files-found: error
