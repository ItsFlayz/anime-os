name: Anime OS Cloud ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install ISO Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap squashfs-tools xorriso syslinux isolinux mtools

    - name: Set Executable Permissions
      run: |
        chmod +x main_builder.sh
        chmod +x scripts/*.sh

    - name: Initialize Base Rootfs Workspace
      run: |
        sudo ./scripts/rootfs_builder.sh

    - name: Stage System Configurations
      run: |
        sudo ./scripts/desktop_setup.sh
        sudo ./scripts/desktop_theme_config.sh
        sudo ./scripts/security_toolkit.sh
        sudo ./scripts/ram_optimizer.sh

    - name: Run ISO Compilation Script
      run: |
        sudo ./scripts/iso_builder.sh

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnimeOS-v1.0-x86_64
        path: iso_build/
